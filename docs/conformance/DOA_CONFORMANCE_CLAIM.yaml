blocking_gaps:
- 'REQ-CORE-21: no aging or version-skew mechanism'
- 'REQ-CORE-22: no identity continuity or terminal marker for closed runs'
- 'REQ-COND-02: no declared prohibition of federation'
- 'Commit-on-red and ticket-zone discipline are enforced by instruction to an LLM; the repository has no deterministic
  check of them. Secret redaction now has a tested deterministic implementation (tools/redact.py), but running it is
  still an instruction to the orchestrator, not an enforced gate'
- '7 of 29 requirements are DESIGNED: the mechanism is described by instructions or by code without tests, with no reproducible evidence'
- No formal published state machine for stages and tickets (close_passed() and audit() are now unit-tested)
- No branch rules on development or main, so PR-first and green CI before merge remain policy and not enforcement
accepted_risks:
- Most requirements are assessed from reading prose instructions, whose execution depends on the host model
- Evidence was gathered at one commit and goes stale as development moves
