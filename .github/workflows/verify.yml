name: Autopilot CI/CD Verification

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Lint and Syntax Check (Python)
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 . --count --select=E9,F,E7,W6 --show-source --statistics

      - name: Install npm dependencies when present
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install

      - name: Confirm dependency-free dashboard
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "No package.json; dashboard has no npm dependencies."

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Pathing & Run Script
        run: python tools/measure-run.py --check-only

      - name: Note dashboard acceptance boundary
        run: echo "Node VM dashboard runtime and performance tests run inside unittest; real browser smoke remains a separate release gate."
