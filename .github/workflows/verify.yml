name: Verify

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python quality tools
        run: python -m pip install flake8

      - name: Install npm dependencies when present
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install

      - name: Confirm dependency-free dashboard
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "No package.json; dashboard has no npm dependencies."

      - name: Check Python syntax errors
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check measure-run
        run: python tools/measure-run.py --check-only

      - name: Note dashboard acceptance boundary
        run: echo "Static and browser dashboard checks are added by the dashboard ticket."
