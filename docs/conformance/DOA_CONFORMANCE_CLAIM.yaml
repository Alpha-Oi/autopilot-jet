assessor: Claude (AI-assisted review) on behalf of Alpha-Oi; not independent
blocking_gaps:
- 'Commit-on-red and the rule that the orchestrator writes no project code are enforced by instruction to an LLM; the
  repository has no deterministic check of them. Secret redaction (tools/redact.py) and ticket zones (sync.py --zone-check)
  now have tested deterministic checks, but running them is still an instruction to the orchestrator, not an enforced
  gate, and the zone check is a verdict after the commit, not a prohibition'
- '3 of 25 failure classes (F-02 partial failure, F-07 model failure, F-11 reward hacking) are DESIGNED: the mechanism is described by instructions or by code without tests, with no reproducible evidence; no requirement is DESIGNED any more'
- No formal published state machine for stages and tickets (close_passed() and audit() are now unit-tested)
- No branch rules on development or main, so PR-first and green CI before merge remain policy and not enforcement
accepted_risks:
- Most requirements are assessed from reading prose instructions, whose execution depends on the host model
- Evidence was gathered at one commit and goes stale as development moves
reassessment: After the remaining actions in DOA_ASSESSMENT.md are done (branch rules, version stamp and
  terminal marker), or by 2026-12-01, whichever is earlier
