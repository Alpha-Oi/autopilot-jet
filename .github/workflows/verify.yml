name: Autopilot CI/CD Verification

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Lint and Syntax Check (Python)
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Install npm dependencies when present
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install

      - name: Confirm dependency-free dashboard
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "No package.json; dashboard has no npm dependencies."

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Pathing & Run Script
        run: python tools/measure-run.py --check-only

      - name: Note dashboard acceptance boundary
        run: echo "Node VM dashboard runtime and performance tests run inside unittest; real browser smoke remains a separate release gate."
